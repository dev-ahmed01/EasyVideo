name: EasyVideo CI
on:
  push:
    branches: [main, feat/local-intent-reel-studio]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and CPU media dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q easyvideo
      - name: Browser JavaScript syntax check
        run: node --check web/app.js
      - name: Unit, API and real-render tests
        run: python -m pytest -q
